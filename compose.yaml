name: meetwell
services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: meetwell_dev
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: meetwell_dev
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/dev-init.sql:/docker-entrypoint-initdb.d/01-dev.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meetwell_dev -d meetwell_dev']
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    build: ./infra/minio
    image: meetwell-minio:2025-10-15
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: meetwell-local
      MINIO_ROOT_PASSWORD: local-storage-only
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['minio-data:/data']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  minio-data:
