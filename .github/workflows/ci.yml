name: Meetwell quality gates
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set up project-local Windows services
        run: pnpm setup:windows
      - run: pnpm db:migrate
      - run: pnpm db:grant-local-worker
      - run: pnpm setup:accounts
      - run: pnpm exec playwright install chromium
      - run: pnpm check
      - name: Stop services and preserve local data
        if: always()
        run: pnpm services:windows:stop
  dev-services:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and health-check the documented development services
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Verify development and test database isolation
        run: |
          docker compose exec -T postgres psql -U meetwell_dev -d meetwell_dev -v ON_ERROR_STOP=1 -c 'SELECT current_database(), postgis_version()'
          docker compose exec -T postgres psql -U meetwell_dev -d meetwell_test -v ON_ERROR_STOP=1 -c 'SELECT current_database()'
      - name: Stop disposable services
        if: always()
        run: docker compose down --volumes
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: meetwell_test_admin
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: meetwell_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U meetwell_test_admin -d meetwell_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgresql://meetwell_test_admin:synthetic-ci-only@127.0.0.1:5432/meetwell_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start private object storage and development mailbox
        run: docker compose up --build -d --wait --wait-timeout 120 minio mailpit
      - run: pnpm setup:accounts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-browser-test-results
          path: test-results/
          retention-days: 3
